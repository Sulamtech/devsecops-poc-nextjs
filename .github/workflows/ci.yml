name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: integrity
    permissions:
      contents: read
    uses: Sulamtech/devsecops-poc-workflows/.github/workflows/reusable-caller-integrity.yml@4f68cda2c804ab4767cbfb44f852e83018320943

  governance:
    name: governance
    needs: integrity
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: Sulamtech/devsecops-poc-workflows/.github/workflows/reusable-pr-governance.yml@4f68cda2c804ab4767cbfb44f852e83018320943

  tests:
    name: tests
    needs: integrity
    permissions:
      contents: read
    uses: Sulamtech/devsecops-poc-workflows/.github/workflows/reusable-node-ci.yml@4f68cda2c804ab4767cbfb44f852e83018320943
    with:
      node-version: "22"

  security:
    name: security
    needs: integrity
    permissions:
      contents: read
      pull-requests: read
    uses: Sulamtech/devsecops-poc-workflows/.github/workflows/reusable-security.yml@4f68cda2c804ab4767cbfb44f852e83018320943
    with:
      image-name: devsecops-poc-nextjs

  feedback:
    name: feedback
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [integrity, tests, security]
    permissions:
      contents: read
      pull-requests: write
    uses: Sulamtech/devsecops-poc-workflows/.github/workflows/reusable-pr-feedback.yml@4f68cda2c804ab4767cbfb44f852e83018320943
    with:
      integrity-result: ${{ needs.integrity.result }}
      tests-result: ${{ needs.tests.result }}
      security-result: ${{ needs.security.result }}
